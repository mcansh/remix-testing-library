name: 🦋 Changesets Release
on:
  push:
    branches:
      - release
      - "release-*"
      - "!release-experimental"
      - "!release-experimental-*"
      - "!release-manual"
      - "!release-manual-*"

permissions:
  id-token: write
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 🦋 Changesets Release
    if: github.repository == 'mcansh/remix-testing-library'
    runs-on: ubuntu-slim
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - name: ⚡️ Install Dependencies
        run: vp install

      - name: ✅ Run Checks
        run: vp check

        # This action has two responsibilities. The first time the workflow runs
        # (initial push to a `release-*` branch) it will create a new branch and
        # then open a PR with the related changes for the new version. After the
        # PR is merged, the workflow will run again and this action will build +
        # publish to npm & github packages.
      - name: 🚀 PR / Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          commit: "chore: Update version for release"
          title: "chore: Update version for release"
          publish: pnpm run changeset:release
          createGithubReleases: true

  comment:
    name: 📝 Comment on issues and pull requests
    if: github.repository == 'mcansh/remix-testing-library' && needs.release.outputs.published == 'true'
    needs: [release]
    runs-on: ubuntu-slim
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@6
        with:
          fetch-depth: 0

      - name: 📝 Comment on issues
        uses: remix-run/release-comment-action@v0.4.2
        with:
          DIRECTORY_TO_CHECK: "./"
          PACKAGE_NAME: "@mcansh/remix-testing-library"
